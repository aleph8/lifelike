name: Release WASM

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Rust and wasm-pack
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add wasm32-unknown-unknown
          curl --fail --location --retry 3 https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz --output /tmp/wasm-pack.tar.gz
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          install /tmp/wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack "$HOME/.cargo/bin/wasm-pack"
      - name: Test and build
        run: |
          cargo test --workspace --locked
          wasm-pack build wasm --target web --out-dir ../target/release-package/pkg
      - name: Package browser module
        run: python3 scripts/package_release.py "$GITHUB_REF_NAME"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/release-package/dist/* \
            --verify-tag --title "Lifelike $GITHUB_REF_NAME" \
            --notes-file .github/RELEASE_NOTES.md
